# Every verified fixture user has accepted the current terms and privacy notice, and owners
# the seller terms, so the re-acceptance gate (Authentication#require_current_consents) lets
# them in.
<% { collector: [], owner: ConsentRecord::OWNERS, unenrolled_owner: ConsentRecord::OWNERS, manager: [], packer: [] }.each do |user, extra| %>
  <% (ConsentRecord::EVERYONE + extra).each do |purpose| %>
<%= user %>_<%= purpose %>:
  user: <%= user %>
  purpose: <%= purpose %>
  version: "<%= ConsentRecord.purpose(purpose).version %>"
  granted: true
  source: sign_up
  created_at: <%= 1.day.ago.to_fs(:db) %>
  <% end %>
<% end %>
