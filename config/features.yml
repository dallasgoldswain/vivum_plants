# Feature registry (PRD §28, decisions D46–D48). Code-owned: every product capability is
# listed here before it is built, and Capabilities.enabled? refuses any key not listed.
#
# Fields
#   domain        grouping for the console and docs
#   state         core     – baseline pilot feature, production starts on an allowlist
#                 pilot    – off until its provider/readiness checks pass
#                 roadmap  – unavailable; may not be implemented
#   implemented   false until the feature is built; unimplemented keys always deny
#   depends_on    keys that must also be enabled for the same user/seller
#   entitlement   subscription entitlement the seller must hold (checked from B07)
#   off           what still works when the flag is off (default: new actions are blocked,
#                 existing data stays readable, reconciliation and recovery keep running)
#   internal      true for operator-only tools with no user-facing help topic (HM02, D76)
#   description   one line, shown in the flag console

# --- Account and access ---
account.profile: { domain: account, state: core, description: "Account profile and email address" }
account.preferences: { domain: account, state: core, description: "Timezone, units and notification preferences" }
account.export: { domain: account, state: core, implemented: true, description: "Machine-readable export of a user's data (§26). A legal right, never gated by this flag" }
account.deletion: { domain: account, state: core, implemented: true, description: "Self-service account deletion (PR07). A legal right, never gated by this flag" }
account.onboarding: { domain: account, state: core, description: "Onboarding: guidance sources and AI consent (ST06)" }
help.manual: { domain: help, state: core, implemented: true, description: "Searchable product manual (HM01)" }
help.contextual: { domain: help, state: core, implemented: true, depends_on: [help.manual], description: "Contextual help links from screens" }

# --- Privacy ---
privacy.consents: { domain: privacy, state: core, implemented: true, description: "Versioned consent records (PR03). Terms acceptance and Settings → Privacy are never gated by this flag" }
privacy.dsr: { domain: privacy, state: core, implemented: true, description: "Data subject requests for account holders (PR05). A legal right, never gated by this flag" }
privacy.buyer_dsr: { domain: privacy, state: core, depends_on: [seller.buyers], description: "Seller tools to export and delete a buyer's data" }

# --- Clients ---
client.pwa: { domain: clients, state: core, description: "Installable PWA" }
client.offline_queue: { domain: clients, state: core, depends_on: [client.pwa], description: "Offline cached reads and queued care logs (OF02)" }
client.ios: { domain: clients, state: core, description: "Hotwire Native iOS app" }
client.android: { domain: clients, state: core, description: "Hotwire Native Android app" }

# --- Collector ---
collection.plants: { domain: collector, state: core, implemented: true, description: "Plant records, acquisition and status (PL01–PL03)" }
collection.search: { domain: collector, state: core, implemented: true, depends_on: [collection.plants], description: "Search and filters (UX01)" }
collection.media: { domain: collector, state: core, implemented: true, depends_on: [collection.plants], description: "Photos and observations (PL04)" }
collection.acquisition: { domain: collector, state: core, implemented: true, depends_on: [collection.plants], description: "Purchase and acquisition details (PL02)" }
collection.environments: { domain: collector, state: core, implemented: true, depends_on: [collection.plants], description: "Growing environments and occupants (EN01, EN03)" }
collection.measurements: { domain: collector, state: core, implemented: true, depends_on: [collection.environments], description: "Dated environment measurements (EN02)" }
collection.tissue_culture: { domain: collector, state: core, depends_on: [collection.plants], description: "Purchased tissue culture tracking (TC01–TC05)" }

# --- Care and library ---
care.logs: { domain: care, state: core, implemented: true, depends_on: [collection.plants], description: "Care events and quick care entry (CA01)" }
care.shared_maintenance: { domain: care, state: core, implemented: true, depends_on: [collection.environments, care.reminders], description: "Environment maintenance tasks (EN04)" }
care.reminders: { domain: care, state: core, implemented: true, depends_on: [care.logs], description: "Schedules, reminders and the Today inbox (CA02–CA05)" }
care.library_guidance: { domain: care, state: core, depends_on: [library.profiles, care.reminders], description: "Suggestions from built-in profiles" }
care.ai_guidance: { domain: care, state: pilot, depends_on: [ai.care_suggestions, care.reminders], description: "AI care suggestions in the care plan" }
library.profiles: { domain: care, state: core, description: "Built-in species reference profiles (GU01)" }
substrate.ingredients: { domain: care, state: core, implemented: true, description: "Ingredient library (SU01)" }
substrate.recipes: { domain: care, state: core, implemented: true, depends_on: [substrate.ingredients], description: "Versioned substrate recipes (SU02, SU04)" }
substrate.scaling: { domain: care, state: core, implemented: true, depends_on: [substrate.recipes], description: "Scale a mix to a target volume (SU03)" }

# --- Notifications ---
notifications.native_push: { domain: notifications, state: core, description: "APNs and FCM push via the native apps" }
notifications.web_push: { domain: notifications, state: core, depends_on: [client.pwa], description: "Browser push for the PWA" }
notifications.email_digest: { domain: notifications, state: core, depends_on: [care.reminders], description: "Daily email digest of due tasks (NT04)" }
notifications.whatsapp: { domain: notifications, state: pilot, depends_on: [privacy.consents, whatsapp.outbound], description: "WhatsApp template reminders (NT03)", off: "Queued template sends stop before delivery" }

# --- AI ---
ai.care_suggestions: { domain: ai, state: pilot, depends_on: [privacy.consents, collection.plants], description: "AI care suggestion requests (GU02, AI01)", off: "Accepted plans and history stay; no new requests" }
ai.dm_extraction: { domain: ai, state: pilot, depends_on: [privacy.consents, whatsapp.connection], description: "AI extraction of claims from WhatsApp DMs (AI02)" }
ai.request_extraction: { domain: ai, state: pilot, depends_on: [privacy.consents, whatsapp.request_capture], description: "AI extraction of plant requests from DMs" }
ai.account_stop: { domain: ai, state: core, description: "Account-wide AI stop (ST05)" }

# --- Billing ---
billing.subscriptions: { domain: billing, state: pilot, depends_on: [seller.workspace], description: "Paystack seller subscriptions (SB01, SB02)" }
billing.comp_accounts: { domain: billing, state: core, depends_on: [seller.workspace], description: "Pilot and comp billing modes (SB03)" }

# --- Seller business ---
seller.workspace: { domain: seller, state: core, implemented: true, description: "Seller workspace (Sell area) for invited sellers (SO03)" }
seller.members: { domain: seller, state: core, implemented: true, depends_on: [seller.workspace], description: "Member management and roles (SO02)" }
seller.invites: { domain: seller, state: core, implemented: true, description: "Operator-issued seller invites (SO03)" }
seller.profile: { domain: seller, state: core, depends_on: [seller.workspace], description: "Business profile (BR01)" }
seller.logo: { domain: seller, state: core, depends_on: [seller.profile], description: "Logo upload and display (BR01)" }
seller.social_links: { domain: seller, state: core, depends_on: [seller.profile], description: "YouTube, Instagram and Facebook links (BR01)" }
seller.paid_branding: { domain: seller, state: pilot, depends_on: [seller.profile], entitlement: paid_branding, description: "Paid colour palettes and layouts (BR02)", off: "New output reverts to standard identity; saved files keep working" }

# --- Seller foundation ---
seller.stock: { domain: seller, state: core, depends_on: [seller.workspace], description: "Stock items, lots and the stock ledger (SE01, SE02)" }
seller.listings: { domain: seller, state: core, depends_on: [seller.stock], description: "Listings (SE03)" }
seller.sale_cards: { domain: seller, state: core, depends_on: [seller.listings], description: "Sale card images and captions (SE07)" }
seller.csv_import: { domain: seller, state: core, depends_on: [seller.stock], description: "CSV stock import with preview (IM01, IM02)" }
seller.orders: { domain: seller, state: core, depends_on: [seller.reservations, seller.buyers], description: "Orders (SE05)" }
seller.reservations: { domain: seller, state: core, depends_on: [seller.stock], description: "Holds and reservations (SE06)", off: "No new holds; existing holds can still be released and expire" }
seller.receipts: { domain: seller, state: core, depends_on: [seller.orders], description: "Receipts (RC01)" }
seller.vat_invoices: { domain: seller, state: core, depends_on: [seller.receipts], description: "Tax invoices and credit notes for VAT sellers (RC01)" }
seller.buyers: { domain: seller, state: core, depends_on: [seller.workspace], description: "Seller-scoped buyers and aliases (BY01, BY02)" }
seller.closeout: { domain: seller, state: core, depends_on: [sales.sessions, seller.orders], description: "Sale Closeout (SC01, SC02)" }
seller.packing: { domain: seller, state: core, depends_on: [seller.orders], description: "Packing checklist and parcel slips (PK01, PK02)" }

# --- Live sales ---
sales.sessions: { domain: sales, state: core, depends_on: [seller.reservations], description: "Sale sessions and Host View (LS01)" }
sales.auctions: { domain: sales, state: core, depends_on: [sales.sessions, seller.stock, seller.reservations], description: "Auction lots and results (LS02)" }
sales.backup_bidder: { domain: sales, state: core, depends_on: [sales.auctions], description: "Transfer a failed win to the backup bidder (LS03)" }
sales.quick_claim: { domain: sales, state: core, depends_on: [sales.sessions], description: "Quick Claim for group claims (LS04)" }
sales.waitlist: { domain: sales, state: core, depends_on: [sales.quick_claim], description: "Waitlist when stock runs out (LS04)" }

# --- WhatsApp ---
whatsapp.share: { domain: whatsapp, state: core, depends_on: [seller.sale_cards], description: "Share and download sale cards (SE08)" }
whatsapp.connection: { domain: whatsapp, state: pilot, depends_on: [seller.workspace], description: "Business number connection (WA01)", off: "Manual sharing and orders keep working" }
whatsapp.dm_claims: { domain: whatsapp, state: pilot, depends_on: [whatsapp.connection, sales.quick_claim], description: "Claims from direct messages (WA02)" }
whatsapp.auto_reserve: { domain: whatsapp, state: pilot, depends_on: [whatsapp.dm_claims, ai.dm_extraction, seller.reservations], description: "Auto-reserve on unambiguous DM claims (WA02)", off: "Queued claims stop reserving; claims go to review" }
whatsapp.request_capture: { domain: whatsapp, state: pilot, depends_on: [whatsapp.connection, requests.manual], description: "Plant requests from DMs (RQ01)" }
whatsapp.outbound: { domain: whatsapp, state: pilot, depends_on: [whatsapp.connection, privacy.consents], description: "Outbound template messages (WA04)" }

# --- Plant requests ---
requests.form: { domain: requests, state: core, depends_on: [requests.manual], description: "Seller request web form for buyers (RQ01)" }
requests.manual: { domain: requests, state: core, depends_on: [seller.workspace, seller.buyers], description: "Manual request entry (RQ01)" }
requests.matching: { domain: requests, state: core, depends_on: [requests.manual, seller.stock], description: "Match requests to stock (RQ02)" }
requests.offers: { domain: requests, state: core, depends_on: [requests.matching, seller.reservations], description: "Offers with expiry (RQ02)" }
requests.wanted_list: { domain: requests, state: core, depends_on: [requests.manual], description: "Demand by plant and form (WL01)" }

